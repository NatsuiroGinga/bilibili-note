[package]
name = "ch5-eval-rs"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tch = { git = "https://github.com/LaurentMazare/tch-rs", rev = "d5bbf6fe6cdbb06006aac5cb673be3c8d029c24b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
