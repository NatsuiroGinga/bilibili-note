   <text style="font-size: 8px; font-family: 'Times New Roman', 'Heiti TC'; fill: #b03a2e" transform="translate(56.251969 204.570867)">本实验已知存在缺陷，仅作趋势参考，不支持「长上下文更好」的结论：</text>
   <text style="font-size: 8px; font-family: 'Times New Roman', 'Heiti TC'; fill: #b03a2e" transform="translate(13.009469 214.014383)">(1) 截断取固定 L=128 块的前 L 个位置，逐流覆盖率约 L/128（L=16 时仅约 12.5% 的流被打分）；</text>
   <text style="font-size: 8px; font-family: 'Times New Roman', 'Heiti TC'; fill: #b03a2e" transform="translate(78.293219 223.801648)">(2) 评价集正类基率随 L 改变，四点分母不同不可直接比较；</text>
   <text style="font-size: 8px; font-family: 'Times New Roman', 'Heiti TC'; fill: #b03a2e" transform="translate(81.293219 233.632664)">(3) 8000 步固定预算下各 L 的训练流量预算最多相差 8 倍。</text>
  </g>
 </g>
