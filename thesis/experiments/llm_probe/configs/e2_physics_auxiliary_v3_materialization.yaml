  directional_table: runs/data-prepared/r2-final-tcp-udp-physics-v3/physics-targets-ns3-v2.parquet
  ns3_root: runs/ns3-data/r2-protocol-dynamics-v3-formal-attempt1

source_contract:
  physics_pool_dataset_version: r2-final-tcp-udp-physics-v3
  physics_pool_config: configs/r2_final_tcp_udp_physics_v3_materialization.yaml
  physics_sample_key: [sequence_id, window_index_in_sequence, physics_group_sha256]
  feature_fields:
    - duration
    - orig_bytes
    - resp_bytes
    - orig_pkts
    - resp_pkts
    - orig_ip_bytes
    - resp_ip_bytes
