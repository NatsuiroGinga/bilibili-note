schema_version: flow_probe_e2_physics_auxiliary_materialization_config_v1
dataset_version: e2-physics-auxiliary-v1-from-r2-v3
stage: theory_selection
status: waiting_for_v3_physics_pool
final_test_visible: false

inputs:
