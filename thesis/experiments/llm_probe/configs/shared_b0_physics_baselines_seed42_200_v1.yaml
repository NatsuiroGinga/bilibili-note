schema_version: flow_probe_shared_b0_physics_baselines_config_v1
config_id: shared-b0-physics-baselines-seed42-200-v1
stage: theory_selection
status: review_pending

probe:
  model_id: /root/autodl-tmp/thesis/models/Qwen3-1.7B
  feature_view: shared_b0_common_v1
  seed: 42
  max_input_length: 512
  max_new_tokens: 16
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05

data:
  classification_train_file: runs/data-frozen/dataset-v1-shared-b0/candidate/qwen_train.jsonl
  classification_validation_file: runs/data-frozen/dataset-v1-shared-b0/validation/genis_qwen.jsonl
  physics_sidecar_root: runs/data-frozen/dataset-v1-shared-b0-physics-v1
  physics_sidecar_file: runs/data-frozen/dataset-v1-shared-b0-physics-v1/candidate/ns3_physics_train.jsonl
  physics_dataset_manifest: runs/data-frozen/dataset-v1-shared-b0-physics-v1/dataset_manifest.json
  visible_observation_fields:
    - total_packets
    - total_bytes
    - packet_length_mean
    - packet_length_min
    - packet_length_max
    - iat_mean_ms
    - packet_rate
    - byte_rate

protocol:
  generation_records_per_run: 800
  physics_records: 2421
  physics_micro_steps: 400
  physics_usage: train_fit_diagnostic
  state_mask: anchor0_plus_one
  state_anchor_count: 5
  state_observed_anchors: 2

training:
  learning_rate: 0.0002
  generation_micro_batch_size: 2
  generation_gradient_accumulation_steps: 2
  effective_generation_batch_size: 4
  hardware_fallback:
    generation_micro_batch_size: 1
    generation_gradient_accumulation_steps: 4
  num_train_epochs: 1
  max_steps: 200
  save_steps: 20
  max_grad_norm: 1.0
  attention_backend: auto
  group_by_length: false
  lambda_state: 1.0
  lambda_physics:
    state_supervision: 0.0
    standard_pinn: 0.01

outputs:
  state_supervision: runs/baselines/shared-b0-qwen-state-supervision-seed42-200-v1
  standard_pinn: runs/baselines/shared-b0-qwen-standard-pinn-seed42-200-v1

tracking:
  project: malicious-traffic-llm
  workspace: mortiswang
  mode: online
  description: 共享B0普通Qwen输入上的状态监督与标准PINN公平对照
  tags:
    - shared-b0
    - qwen3-1.7b
    - seed42
    - steps200
    - physics-baseline
