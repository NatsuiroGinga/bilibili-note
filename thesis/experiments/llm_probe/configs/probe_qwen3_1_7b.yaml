probe:
  model_id: Qwen/Qwen3-1.7B
  feature_view: canonical_core_v1
  seed: 42
  max_input_length: 512
  max_new_tokens: 16
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05

training:
  train_file: data/processed/probe/train.jsonl
