  per_device_train_batch_size: 4
  gradient_accumulation_steps: 16
  num_train_epochs: 3

evaluation:
  test_file: data/processed/probe/test.jsonl
  output_dir: runs/probe-qwen3-1.7b-seed42/evaluation

tracking:
  project: malicious-traffic-llm
  workspace: mortiswang
  run_name: llm-probe-primary-probe-seed42
  description: 主数据集上的 Qwen3-1.7B QLoRA 正式探针
  mode: online
  tags: [llm-probe, primary, probe, qlora]
