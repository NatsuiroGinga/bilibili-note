[project]
name = "flow-probe"
version = "0.1.0"
description = "生成式恶意流量探针实验"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.2,<4",
    "pyarrow>=25,<26",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.5,<2",
    "xgboost>=3.0,<4",
]

[project.optional-dependencies]
gpu = [
    "accelerate>=1.10,<2",
    "bitsandbytes>=0.46,<1",
    "datasets>=4.0,<5",
    "peft>=0.17,<1",
    "swanlab>=0.9,<1",
    "torch>=2.8,<3",
    "transformers>=4.55,<5",
    "trl>=0.21,<1",
]

[dependency-groups]
dev = [
    "black>=25.1,<26",
    "pyright>=1.1.411",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
flow-probe-prepare = "flow_probe.prepare:main"
flow-probe-sample = "flow_probe.sampling:main"
flow-probe-sample-hierarchical = "flow_probe.hierarchical_sampling:main"
flow-probe-build-multitask = "flow_probe.multitask_bundle:main"
flow-probe-train = "flow_probe.train_sft:main"
flow-probe-evaluate = "flow_probe.evaluate_model:main"
flow-probe-swanlab-diagnostic = "flow_probe.swanlab_diagnostic:main"
flow-probe-audit-genis = "flow_probe.genis_audit:main"
flow-probe-plan-genis = "flow_probe.genis_forward_split:main"
flow-probe-materialize-genis = "flow_probe.genis_forward_split:materialize_main"
flow-probe-traditional-baselines = "flow_probe.traditional_baselines:main"
flow-probe-multiclass-baselines = "flow_probe.multiclass_baselines:main"
flow-probe-tabular-baselines = "flow_probe.tabular_baselines:main"
flow-probe-e2-hard-domain-baselines = "flow_probe.e2_hard_domain_baselines:main"
flow-probe-e2-hard-domain-train = "flow_probe.e2_hard_domain_train:main"
flow-probe-e2-physics-auxiliary = "flow_probe.e2_physics_auxiliary:main"
flow-probe-evaluate-hierarchical = "flow_probe.hierarchical_evaluation:main"
flow-probe-swanlab-artifact-smoke = "flow_probe.swanlab_artifact_smoke:main"
flow-probe-analyze-h1 = "flow_probe.h1_analysis:main"
flow-probe-validate-physics = "flow_probe.physics_validity:main"
flow-probe-probe-qwen-physics-gradient = "flow_probe.qwen_physics_gradient:main"
flow-probe-validate-ns3-truth = "flow_probe.ns3_truth:main"
flow-probe-run-ns3-matrix = "flow_probe.ns3_experiment:main"
flow-probe-build-ns3-sequences = "flow_probe.ns3_sequences:main"
flow-probe-train-physics = "flow_probe.physics_train:main"
flow-probe-train-asymmetric-physics = "flow_probe.asymmetric_physics_train:main"
flow-probe-diagnose-gradient-conflict = "flow_probe.gradient_conflict:main"
flow-probe-diagnose-gradient-feasibility = "flow_probe.gradient_feasibility:main"
flow-probe-train-game = "flow_probe.game_train:main"
flow-probe-audit-dedale = "flow_probe.dedale_audit:main"
flow-probe-process-tqh-c2 = "flow_probe.tqh_c2:main"
flow-probe-materialize-tqh-c2-abc-budget = "flow_probe.tqh_c2_candidate_abc_fixed:main"
flow-probe-build-unified-budget = "flow_probe.unified_budget:main"
flow-probe-build-shared-b0-view = "flow_probe.shared_b0_view:main"
flow-probe-analyze-physics-errors = "flow_probe.physics_error_analysis:main"
flow-probe-plan-ns3-domain-randomization = "flow_probe.ns3_domain_randomization:main"
flow-probe-run-ns3-domain-randomization = "flow_probe.ns3_domain_experiment:main"
flow-probe-build-ns3-observability-sequences = "flow_probe.ns3_observability_sequences:main"
flow-probe-diagnose-observability = "flow_probe.observability_diagnostic:main"
flow-probe-train-bounded-physics = "flow_probe.bounded_physics_train:main"
flow-probe-evaluate-bounded-physics = "flow_probe.bounded_physics_evaluation:main"
flow-probe-evaluate-s3-same-split-physics = "flow_probe.s3_same_split_physics:main"
flow-probe-ns3-physics-baseline = "flow_probe.ns3_physics_baselines:main"
flow-probe-train-shared-b0-physics = "flow_probe.shared_b0_physics_train:main"
flow-probe-lspr24-g0-reference = "flow_probe.lspr24_g0_reference:main"
flow-probe-r2-final-qwen = "flow_probe.r2_final_qwen_probe:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_probe"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]


[tool.pyright]
include = [
    "src/flow_probe/r2_protocol_contract.py",
    "src/flow_probe/shared_b0_physics_sidecar.py",
]
exclude = [
    ".venv",
    "data",
    "runs",
    "swanlog",
]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
venvPath = "."
venv = ".venv"
