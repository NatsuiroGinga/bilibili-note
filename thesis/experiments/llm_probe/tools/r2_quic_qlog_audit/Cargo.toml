[package]
name = "r2_quic_qlog_audit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "QUIC-MedNetCom qlog 物理辅助池确定性审计工具"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
hex = "0.4.3"
libc = "0.2.174"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["arbitrary_precision"] }
sha2 = "0.10.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
