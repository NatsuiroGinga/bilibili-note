[package]
name = "r2_genis_totbytes_verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "GeNIS TotBytes 全量逐包复算与口径裁决工具"

[dependencies]
ahash = "0.8.12"
anyhow = "1.0.98"
arrow-array = "55.2.0"
arrow-schema = "55.2.0"
blake2 = "0.10.6"
clap = { version = "4.5.40", features = ["derive"] }
csv = "1.3.1"
hex = "0.4.3"
libc = "0.2.174"
md-5 = "0.10.6"
parquet = { version = "55.2.0", default-features = false, features = ["arrow"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
